<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pollería Daniel el Gallo | Inventario</title>

    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Pollería Daniel el Gallo</h1>

    <div class="container">

        <div class="formContainer">
            <label for="name">Nombre del producto:</label>
            <input type="text" id="name" placeholder="Ej. Pollo entero">
            
            <label for="price">Precio:</label>
            <input type="number" id="price" placeholder="Ingresa el precio" min="1">
            
            <button id="addProduct">Agregar producto</button>
        </div>

      
        <table id="productsTable">
            <thead>
                <tr>
                    <th>N.º</th>
                    <th>Producto</th>
                    <th>Precio</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
          
            </tbody>
        </table>
    </div>

    <img class="logo-polleria" src="Pollo logo_nobg_preview_photiu.ai.png" alt="Logo de Pollería Daniel el Gallo">

    <script src="functions.js"></script>
</body>
</html>
